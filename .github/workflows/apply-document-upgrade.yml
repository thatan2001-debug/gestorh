name: Apply document upgrade

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/upgrade/ready

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/documentos-premium-20260730
          fetch-depth: 0

      - name: Reconstruct and verify atomic patch
        shell: bash
        run: |
          test -f .github/upgrade/ready
          cat .github/upgrade/part-* | base64 --decode | gzip --decompress > /tmp/documentos-premium.patch
          echo "d3becb86045859e059d070aefdc6047cc721d3e0ad5e585bbd41ddda0e1b1423  /tmp/documentos-premium.patch" | sha256sum --check
          git apply --check /tmp/documentos-premium.patch
          git apply --index --whitespace=fix /tmp/documentos-premium.patch
          git diff --cached --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymupdf

      - name: Run all tests
        run: pytest -q --junitxml=artifacts/pytest-results.xml

      - name: Generate four final PDFs
        run: python scripts/generar_muestras_documentales.py

      - name: Render and inspect every page
        run: python scripts/preflight_pdfs.py

      - name: Upload final PDFs and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: documentos-premium-finales
          path: |
            artifacts/documentos_finales/
            artifacts/renders/
            artifacts/preflight.json
            artifacts/pytest-results.xml
          retention-days: 14

      - name: Commit verified source implementation
        shell: bash
        run: |
          rm -rf artifacts .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git restore --staged --worktree .github/workflows
          rm -rf .github/upgrade
          git add -A
          git diff --cached --check
          git config user.name "Gestor RH IA Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: implementar sistema documental premium y pruebas visuales"
          git push origin HEAD:feature/documentos-premium-20260730
