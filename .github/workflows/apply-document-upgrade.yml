name: Apply final document fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/final-fix/ready

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/documentos-premium-20260730
          fetch-depth: 0

      - name: Reconstruct and verify final patch
        shell: bash
        run: |
          test -f .github/final-fix/ready
          cat .github/final-fix/part-* | base64 --decode | gzip --decompress > /tmp/final-fixes.patch
          echo "d92fdfda2bee6a57b4b98be721b16ee8d2ddb83299b9f004e45668f43abb5de7  /tmp/final-fixes.patch" | sha256sum --check
          git apply --check /tmp/final-fixes.patch
          git apply --index --whitespace=fix /tmp/final-fixes.patch
          git diff --cached --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymupdf

      - name: Run all tests
        run: pytest -q --junitxml=artifacts/pytest-results.xml

      - name: Generate four final PDFs
        run: python scripts/generar_muestras_documentales.py

      - name: Render and inspect every page
        run: python scripts/preflight_pdfs.py

      - name: Upload final PDFs and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: documentos-premium-finales-corregidos
          path: |
            artifacts/documentos_finales/
            artifacts/renders/
            artifacts/preflight.json
            artifacts/pytest-results.xml
          retention-days: 14

      - name: Commit verified final source fixes
        shell: bash
        run: |
          rm -rf artifacts .pytest_cache .github/final-fix
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git restore --staged --worktree .github/workflows
          git add -A
          git diff --cached --check
          git config user.name "Gestor RH IA Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: periodizar intereses y optimizar paginación final"
          git push origin HEAD:feature/documentos-premium-20260730
