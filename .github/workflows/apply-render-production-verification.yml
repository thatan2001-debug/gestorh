name: Apply Render production verification

on:
  push:
    branches:
      - fix/render-production-verification
    paths:
      - '.github/workflows/apply-render-production-verification.yml'

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/render-production-verification
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply_render_production_verification.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymupdf

      - name: Validate entrypoint and complete suite
        run: |
          python -m py_compile app.py utils/deployment_diagnostics.py
          pytest -q tests/test_deployment_diagnostics.py
          pytest -q --junitxml=artifacts/pytest-results-render-verification.xml

      - name: Commit verified implementation
        run: |
          rm scripts/apply_render_production_verification.py
          rm .github/workflows/apply-render-production-verification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py render.yaml utils/deployment_diagnostics.py tests/test_deployment_diagnostics.py
          git add -u scripts/apply_render_production_verification.py .github/workflows/apply-render-production-verification.yml
          git commit -m 'fix: pin Render to main and expose deployment verification'
          git push origin HEAD:fix/render-production-verification
