name: Repo snapshot for document upgrade

on:
  push:
    branches:
      - feature/documentos-premium-20260730
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          mkdir -p artifacts
          zip -r artifacts/gestorh-source.zip . -x '.git/*' 'artifacts/*'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: gestorh-source
          path: artifacts/gestorh-source.zip
          retention-days: 3
