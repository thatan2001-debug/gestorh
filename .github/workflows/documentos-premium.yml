name: Aplicar corrección de aportes en liquidación

on:
  push:
    branches:
      - feature/documentos-finales-20260730
    paths:
      - '.github/workflows/documentos-premium.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/documentos-finales-20260730
          fetch-depth: 0

      - name: Verify and apply source payload
        shell: bash
        run: |
          echo '9cd6242e2dfe590c1458df380a743a02d9755eb76e05bf5b45e5db672348a53a  .github/aportes-ui-payload.txt' | sha256sum -c -
          base64 -d .github/aportes-ui-payload.txt > /tmp/aportes-ui-fix.tar.gz
          echo '1bc06dca3a69676ccf0db53c21aa25beda0a0190fb56d7182e1925a50af09134  /tmp/aportes-ui-fix.tar.gz' | sha256sum -c -
          tar -xzf /tmp/aportes-ui-fix.tar.gz -C .
          rm .github/aportes-ui-payload.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymupdf

      - name: Run regression tests
        run: |
          pytest -q tests/test_validaciones_documentales.py tests/test_aportes_ui_wiring.py tests/test_documentos_premium.py
          pytest -q

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utils/pantalla_documentos.py utils/validaciones_documentales.py utils/calcular_liquidacion.py
          git add tests/test_validaciones_documentales.py tests/test_aportes_ui_wiring.py
          git add -u .github/aportes-ui-payload.txt
          git commit -m 'fix: allow confirming final payroll contributions'
          git push origin HEAD:feature/documentos-finales-20260730
