name: Aplicar corrección de aportes UI

on:
  push:
    branches:
      - fix/aportes-periodo-final-ui
    paths:
      - '.github/workflows/apply-aportes-ui-fix.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: fix/aportes-periodo-final-ui
          fetch-depth: 0

      - name: Apply verified source patch
        run: |
          git apply --check scripts/aportes-periodo-final.patch
          git apply scripts/aportes-periodo-final.patch
          rm scripts/aportes-periodo-final.patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymupdf

      - name: Run targeted and complete tests
        run: |
          pytest -q tests/test_validaciones_documentales.py tests/test_aportes_ui_wiring.py tests/test_documentos_premium.py
          pytest -q --junitxml=artifacts/pytest-results-aportes.xml

      - name: Publish verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utils/pantalla_documentos.py utils/validaciones_documentales.py utils/calcular_liquidacion.py
          git add tests/test_validaciones_documentales.py tests/test_aportes_ui_wiring.py
          git add -u scripts/aportes-periodo-final.patch
          git commit -m 'fix: allow confirming final payroll contributions'
          git push origin HEAD:fix/aportes-periodo-final-ui
