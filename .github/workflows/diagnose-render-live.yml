name: Diagnose Render live deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-render-live.yml'

permissions:
  contents: write

jobs:
  apply-render-production-verification:
    if: github.head_ref == 'fix/render-production-verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/render-production-verification
          fetch-depth: 0

      - name: Apply deterministic production patch
        run: python scripts/apply_render_production_verification.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pymupdf

      - name: Validate entrypoint and complete suite
        run: |
          python -m py_compile app.py utils/deployment_diagnostics.py
          pytest -q tests/test_deployment_diagnostics.py
          pytest -q --junitxml=artifacts/pytest-results-render-verification.xml

      - name: Publish only verified source changes
        run: |
          rm -f scripts/apply_render_production_verification.py
          rm -f .github/workflows/apply-render-production-verification.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/diagnose-render-live.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: pin Render to main and expose deployment verification'
          git push origin HEAD:fix/render-production-verification

# Publication retry: stage all verified additions, modifications and deletions.
