name: Diagnose Render live deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-render-live.yml'

permissions:
  contents: write

jobs:
  clean-render-production-verification:
    if: github.head_ref == 'fix/render-production-verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/render-production-verification
          fetch-depth: 0

      - name: Remove generated caches and artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf artifacts .pytest_cache
          git fetch origin main
          git checkout origin/main -- .github/workflows/diagnose-render-live.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove generated verification artifacts'
          git push origin HEAD:fix/render-production-verification
